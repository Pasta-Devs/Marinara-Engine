<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Marinara Engine — RPG chat and roleplay engine" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f0f13" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Marinara Engine</title>
    <style>
      /* Sets WKWebView native backing color for iOS safe-area zones.
         Literal opaque value required — CSS vars not resolved for backing.
         !important guards against any external stylesheet override winning cascade. */
      html,
      body {
        background-color: #0f0f13 !important;
      }
    </style>
    <style id="marinara-cascade-layers">
      /* Cascade order for every stylesheet in the app (styles/README-theming.md):
         mari-protected beats everything, so a theme can restyle the top bar, the chats sidebar,
         the Library sidebar and Ctrl+K but never hide, move or blank them. mari-theme-important holds
         a custom theme's !important rules, so they beat the app's own !important ones. The app's
         CSS sits in mari-app, the Appearance pickers in mari-pickers, and the custom theme's normal
         rules stay unlayered, so they win over both without !important.
         translate/rotate/scale are written as var(--mari-none, none): the Safari 14 build target
         otherwise folds them into transform: translate(0,0) rotate(0) scale(1), and a transform on
         html, body or #root makes them the box for the fixed app shell, which collapses to 0px. */
      @layer mari-protected, mari-theme-important, theme, base, components, utilities, mari-app, mari-pickers;
      @layer mari-protected {
        html,
        body {
          visibility: visible !important;
          opacity: 1 !important;
          transform: none !important;
          translate: var(--mari-none, none) !important;
          rotate: var(--mari-none, none) !important;
          scale: var(--mari-none, none) !important;
          filter: none !important;
          clip-path: none !important;
          mask: none !important;
          content-visibility: visible !important;
          pointer-events: auto !important;
        }
        html { display: block !important; }
        body { display: block !important; }
        #root {
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
          transform: none !important;
          translate: var(--mari-none, none) !important;
          rotate: var(--mari-none, none) !important;
          scale: var(--mari-none, none) !important;
          filter: none !important;
          clip-path: none !important;
          mask: none !important;
          content-visibility: visible !important;
        }
        [data-component="AppShell"] {
          position: fixed !important;
          inset: 0 !important;
          display: flex !important;
          visibility: visible !important;
          opacity: 1 !important;
          transform: none !important;
          translate: var(--mari-none, none) !important;
          rotate: var(--mari-none, none) !important;
          scale: var(--mari-none, none) !important;
          filter: none !important;
          clip-path: none !important;
          mask: none !important;
          content-visibility: visible !important;
        }
        [data-component="OverhaulShellRow"],
        [data-component="TopBar"],
        [data-component="ChatSidebarSlot"]:not([aria-hidden="true"]),
        [data-component="ChatSidebarPanel"]:not([aria-hidden="true"]),
        [data-component="RightPanelDesktopSlot"]:not([aria-hidden="true"]),
        [data-component="RightPanelDesktop"]:not([aria-hidden="true"]),
        [data-component="RightPanelMobile"],
        [data-component="GlobalOmnibar"],
        [data-component="GlobalOmnibar.Panel"] {
          visibility: visible !important;
          opacity: 1 !important;
          clip-path: none !important;
          mask: none !important;
          content-visibility: visible !important;
          translate: var(--mari-none, none) !important;
          rotate: var(--mari-none, none) !important;
          scale: var(--mari-none, none) !important;
        }
        [data-component="TopBar"]:not(.is-autohide),
        [data-component="ChatSidebarPanel"]:not([aria-hidden="true"]),
        [data-component="RightPanelDesktop"]:not([aria-hidden="true"]),
        [data-component="RightPanelMobile"] {
          pointer-events: auto !important;
          zoom: 1 !important;
        }
        header[data-overhaul-topbar="true"]:not(.is-autohide) {
          display: flex !important;
          position: relative !important;
          inset: auto !important;
          transform: none !important;
          margin: 0 !important;
          min-height: 2rem !important;
        }
        header[data-overhaul-topbar="mobile"] {
          display: grid !important;
          position: relative !important;
          inset: auto !important;
          transform: none !important;
          margin: 0 !important;
          min-height: 2.5rem !important;
        }
        [data-component="ChatSidebarSlot"]:not([aria-hidden="true"]),
        [data-component="RightPanelDesktopSlot"]:not([aria-hidden="true"]) {
          display: block !important;
          position: relative !important;
          inset: auto !important;
          transform: none !important;
          margin: 0 !important;
          min-width: 10rem !important;
        }
        [data-component="ChatSidebarPanel"].mari-shell-panel-enter-left,
        [data-component="RightPanelDesktop"].mari-shell-panel-enter-right {
          display: block !important;
          position: absolute !important;
          top: 0 !important;
          bottom: 0 !important;
          transform: translate3d(0, 0, 0) !important;
          margin: 0 !important;
        }
        [data-component="ChatSidebarPanel"].mari-shell-panel-enter-left { left: 0 !important; right: auto !important; }
        [data-component="RightPanelDesktop"].mari-shell-panel-enter-right { right: 0 !important; left: auto !important; }
        /* Pseudo-element decorations (scanlines, grain, vignettes) never take clicks. */
        :is(html, body, #root, [data-component="AppShell"], [data-component="OverhaulShellRow"], main)::before,
        :is(html, body, #root, [data-component="AppShell"], [data-component="OverhaulShellRow"], main)::after {
          pointer-events: none !important;
        }
        /* The "Keep this theme?" and safe-mode bars live in a shadow root; only their host is reachable. */
        mari-theme-safety {
          all: initial !important;
          display: block !important;
          position: fixed !important;
          z-index: 2147483647 !important;
          left: 0 !important;
          right: 0 !important;
          bottom: 0 !important;
          top: auto !important;
          width: auto !important;
          height: auto !important;
          visibility: visible !important;
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
          pointer-events: none !important;
        }
        /* The chrome guard measures with and without the theme in one task; nothing may animate. */
        html[data-mari-guard-measure] *,
        html[data-mari-guard-measure] *::before,
        html[data-mari-guard-measure] *::after {
          transition: none !important;
        }
      }
    </style>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
