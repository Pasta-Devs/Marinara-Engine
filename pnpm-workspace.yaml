packages:
  - "packages/*"

# Let pnpm 12 obtain the exact project pin. Launchers use their own verified
# Corepack/npm runner to hand off from older pnpm versions; the package engine
# range permits that one-time handoff before the refreshed launcher takes over.
pmOnFail: download

# Supply-chain guardrails: delay newly published package versions long enough for
# registry takedowns and advisory systems to catch common compromise waves.
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
# Released installs must remain reproducible even when older dependency versions
# lose trust metadata across pnpm or registry updates.
trustPolicy: off
blockExoticSubdeps: true

patchedDependencies:
  # Let an explicit speech-clock opening override held vowels; voice and idle without it stay native.
  # The painted mouth opens across the whole lip line (rig halfLen), not its middle half, for every vowel.
  mesh-avatar@0.2.1: patches/mesh-avatar@0.2.1.patch
  onnxruntime-node@1.30.0: patches/onnxruntime-node@1.30.0.patch
  # Upstream READY-handshake fix (pinojs/thread-stream#246, #251). Drop once a release after 4.2.0 ships it.
  thread-stream@4.2.0: patches/thread-stream@4.2.0.patch
  # GHSA-mrhx-c7xc-m3w5: preserve the installed-agent Zod 3 API with the upstream
  # bounded-collection fix backported to both bundled parsers. See patch notes.
  zod@3.25.76: patches/zod@3.25.76.patch

# The advisory matches versions, so it cannot recognize the security backport.
# The security regression verifies the patch is installed and pins this exception
# to exactly 3.25.76 in the API-1 compatibility alias. Engine core uses native
# 4.6.7; retire the patch and exception only when the legacy package API retires.
audit:
  ignore:
    - GHSA-mrhx-c7xc-m3w5

# Native/build dependencies permitted to run install scripts. Explicitly deny the
# known no-op so noninteractive installs never need to edit this tracked policy.
allowBuilds:
  esbuild: true
  sharp: true
  onnxruntime-node: true
  protobufjs: true
  "@google/genai": false

# pnpm 12 reads non-registry configuration from the workspace, not .npmrc.
autoInstallPeers: false
storeDir: .pnpm-store
virtualStoreDir: .pnpm
virtualStoreDirMaxLength: 80

# Retain every existing transitive security override during the format migration.
overrides:
  "@babel/core": "7.29.7"
  "@babel/plugin-transform-modules-systemjs": "7.29.8"
  "@earendil-works/pi-coding-agent>undici@>=8 <8.12.2": "8.12.3"
  "@fastify/busboy@<3.2.3": "3.2.3"
  "@hono/node-server": "2.1.5"
  "@modelcontextprotocol/sdk": "1.32.1"
  "adm-zip@<0.6.1": "0.6.1"
  "body-parser": "2.4.0"
  "brace-expansion@>=2 <2.1.7": "2.1.7"
  "brace-expansion@>=5 <5.0.12": "5.0.12"
  "browserslist": "4.29.4"
  "fast-copy@>=4 <4.2.0": "4.2.0"
  "fast-uri@>=3 <3.1.9": "3.1.9"
  "fast-uri@>=4 <4.2.3": "4.2.3"
  "hono": "4.13.13"
  "ip-address": "10.7.4"
  "js-yaml": "4.3.2"
  "nanoid@3": "3.3.20"
  "postcss": "8.5.31"
  "protobufjs": "7.6.6"
  "proxy-addr@<2.0.8": "2.0.8"
  "qs": "6.16.1"
  "sharp@0.34.5": "0.35.5"
  "serialize-javascript@>=7 <7.1.3": "7.1.3"
  "source-map-js@<1.2.2": "1.2.2"
