name: Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  label:
    name: Label by title prefix
    # Only a title edit can change the label. Body edits are skipped so a label a maintainer removed stays removed.
    if: github.event.action == 'opened' || github.event.changes.title
    # Quick retitles of one issue run in order instead of racing.
    concurrency:
      group: issue-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add the type label for the title prefix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Issue forms add these labels, but issues filed with gh, the API or a blank form get none.
            const prefixLabels = [
              ['[issue]', 'bug'],
              ['[bug]', 'bug'],
              ['[feature]', 'enhancement'],
              ['[docs-i18n]', 'docs'],
            ];
            const labelFor = (title) =>
              prefixLabels.find(([prefix]) => title.trim().toLowerCase().startsWith(prefix))?.[1];
            const issue = context.payload.issue;
            const target = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };
            const label = labelFor(issue.title);
            const previousTitle = context.payload.changes?.title?.from;
            const previous = previousTitle === undefined ? undefined : labelFor(previousTitle);
            // On an edit only a changed prefix counts, so a label a maintainer removed stays removed.
            // A title switched to another prefix is a correction, so the old prefix's label goes.
            // A prefix removed from the title leaves the labels alone.
            if (!label || previous === label) {
              return;
            }
            // The event's label list is a snapshot from delivery time; read the issue's labels now.
            const { data: current } = await github.rest.issues.listLabelsOnIssue({ ...target, per_page: 100 });
            const has = (name) => current.some((existing) => existing.name === name);
            if (previous && has(previous)) {
              try {
                await github.rest.issues.removeLabel({ ...target, name: previous });
              } catch (error) {
                // Someone removed it since the read above.
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
            if (!has(label)) {
              await github.rest.issues.addLabels({ ...target, labels: [label] });
            }
