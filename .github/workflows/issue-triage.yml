name: Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  label:
    name: Label by title prefix
    # Only a title edit can change the label. Body edits are skipped so a label a maintainer removed stays removed.
    if: github.event.action == 'opened' || github.event.changes.title
    # Quick retitles of one issue run in order instead of racing.
    concurrency:
      group: issue-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add the type label for the title prefix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Issue forms add these labels, but issues filed with gh, the API or a blank form get none.
            const prefixLabels = [
              ['[issue]', 'bug'],
              ['[bug]', 'bug'],
              ['[feature]', 'enhancement'],
              ['[docs-i18n]', 'docs'],
            ];
            const labelFor = (title) =>
              prefixLabels.find(([prefix]) => title.trim().toLowerCase().startsWith(prefix))?.[1];
            const { payload } = context;
            const target = { owner: context.repo.owner, repo: context.repo.repo, issue_number: payload.issue.number };
            const edited = payload.action === 'edited';
            // On an edit only a changed prefix counts, so a label a maintainer removed stays removed.
            if (edited && labelFor(payload.changes.title.from) === labelFor(payload.issue.title)) {
              return;
            }
            // Read the issue now. The event is a snapshot from delivery time, and during quick retitles
            // GitHub can drop a queued run, so only the current title and labels can be trusted.
            const { data: issue } = await github.rest.issues.get(target);
            const label = labelFor(issue.title);
            // A prefix removed from the title leaves the labels alone.
            if (!label) {
              return;
            }
            const current = issue.labels.map((existing) => existing.name);
            // A title switched to another prefix is a correction, so the other type labels go.
            const typeLabels = [...new Set(prefixLabels.map(([, name]) => name))];
            const stale = edited ? typeLabels.filter((name) => name !== label && current.includes(name)) : [];
            for (const name of stale) {
              try {
                await github.rest.issues.removeLabel({ ...target, name });
              } catch (error) {
                // Someone removed it since the read above.
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
            if (!current.includes(label)) {
              await github.rest.issues.addLabels({ ...target, labels: [label] });
            }
