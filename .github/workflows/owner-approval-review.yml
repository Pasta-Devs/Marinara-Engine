name: Owner Approval Review Evaluator

on:
  workflow_run:
    workflows: [Owner Approval Review Signal]
    types: [completed]

# No concurrency group: GitHub runs this on the default branch, so every run a group cancelled showed as a failed check
# on main. A run that a newer review signal for the same pull request supersedes ends without publishing instead
# (scripts/evaluate-owner-approval.mjs), and the newest run publishes.

jobs:
  evaluate:
    name: Re-evaluate staging owner approval
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Resolve pull request
        id: pull-request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            let pullRequests = context.payload.workflow_run.pull_requests || [];
            if (pullRequests.length === 0) {
              const response = await github.request(
                'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.payload.workflow_run.head_sha,
                },
              );
              pullRequests = response.data;
            }
            // Fork commits are in neither list: match the reviewed commit against open PR heads.
            if (pullRequests.length === 0) {
              const openPullRequests = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              pullRequests = openPullRequests.filter(
                (pullRequest) => pullRequest.head.sha === context.payload.workflow_run.head_sha,
              );
            }

            const pullNumbers = [...new Set(pullRequests.map((pullRequest) => pullRequest.number))];
            if (pullNumbers.length === 0) {
              core.notice('The review signal is not associated with a pull request.');
              return;
            }
            if (pullNumbers.length !== 1) {
              core.setFailed('The review signal is associated with more than one pull request.');
              return;
            }

            core.setOutput('number', String(pullNumbers[0]));

      - name: Checkout trusted default branch
        if: steps.pull-request.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        if: steps.pull-request.outputs.number != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Publish owner approval status
        if: steps.pull-request.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MEMBERS_TOKEN_CONFIGURED: ${{ secrets.PASTA_DEVS_MEMBERS_TOKEN != '' }}
          PASTA_DEVS_MEMBERS_TOKEN: ${{ secrets.PASTA_DEVS_MEMBERS_TOKEN }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The review signal this run answers; a newer one for the same pull request supersedes it.
          SIGNAL_RUN_ID: ${{ github.event.workflow_run.id }}
          SIGNAL_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          SIGNAL_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/evaluate-owner-approval.mjs
