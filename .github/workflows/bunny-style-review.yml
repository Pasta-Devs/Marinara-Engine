# .github/workflows/bunny-review.yml
name: Bunny Style Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/bunny-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR and checkout head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify we're in a git repo
          git status
          
          # Get PR details
          PR_NUM="${{ github.event.issue.number }}"
          BASE=$(gh pr view "$PR_NUM" --json baseRefName -q .baseRefName)
          HEAD=$(gh pr view "$PR_NUM" --json headRefName -q .headRefName)
          
          # Fetch the PR branches
          git fetch origin "$BASE:$BASE" || git fetch origin "$BASE"
          git fetch origin "pull/$PR_NUM/head:pr-$PR_NUM"
          
          # Checkout the PR head
          git checkout "pr-$PR_NUM"
          
          # Set the base ref for the review script
          echo "PR_BASE_REF=$BASE" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: gpt-5.5
        run: python scripts/bunny_review.py

      - name: Post the review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.issue.number }}" --body-file review.md