name: Bunny Style Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/bunny-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted review runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: bunny-target

      - name: Fetch PR and checkout target head
        working-directory: bunny-target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.issue.number }}"
          BASE=$(gh pr view "$PR_NUM" --json baseRefName -q .baseRefName)
          gh pr checkout "$PR_NUM"
          git fetch origin "$BASE" --depth=1 || true
          echo "PR_BASE_REF=origin/$BASE" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run review
        working-directory: bunny-target
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: gpt-5.5
          BUNNY_SKILL_PATH: ${{ github.workspace }}/skills/bunny-style-review/SKILL.md
        run: python ../scripts/bunny_review.py

      - name: Post the review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.issue.number }}" --body-file bunny-target/review.md
