name: CodeQL

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

# Only PR runs cancel a superseded run; push, schedule and dispatch runs finish so the overlay-base database cache is saved.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Build the incremental (overlay) base database on staging pushes, so PRs into staging
      # can analyse only their diff. The action otherwise builds it only on the default branch.
      CODE_SCANNING_IS_ANALYZING_DEFAULT_BRANCH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && 'true' || '' }}
    permissions:
      contents: read
      security-events: write # Upload CodeQL SARIF results.
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The Node regression harness is about 30% of the TypeScript lines and never ships.
          config: |
            paths-ignore:
              - scripts/regressions

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          # The override above would otherwise make staging upload its database as main's.
          upload-database: ${{ github.ref == 'refs/heads/main' }}
