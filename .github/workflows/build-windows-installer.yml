name: Build Windows Installer

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z release tag to attach installer to"
        required: true
        type: string

jobs:
  build-windows-installer:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
        run: |
          node scripts/check-release-tag.mjs "$RELEASE_TAG"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        id: build
        shell: bash
        working-directory: win/installer
        run: |
          version="$(node -p "require('../../package.json').version")"
          commit="$(git -C ../.. rev-parse HEAD)"
          makensis -DRELEASE_COMMIT="$commit" installer.nsi
          installer="Marinara-Engine-Installer-${version}.exe"
          if [ ! -s "$installer" ]; then
            echo "Installer was not produced at win/installer/$installer" >&2
            exit 1
          fi
          echo "installer=win/installer/${installer}" >> "$GITHUB_OUTPUT"
          echo "name=Marinara-Engine-Installer-${version}.exe" >> "$GITHUB_OUTPUT"
          ls -lh "$installer"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.installer }}

      - name: Attach installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          for i in {1..60}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release upload "$TAG" "${{ steps.build.outputs.installer }}" --clobber
