# .github/workflows/bunny-review.yml
name: Bunny Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: read # needed to read CI status

concurrency:
  group: bunny-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event_name == 'pull_request' ||
      (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/bunny-review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    env:
      PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(gh pr view "$PR_NUM" --json baseRefName -q .baseRefName)
          echo "PR_BASE_REF=$BASE" >> "$GITHUB_ENV"
          git fetch --force origin "$BASE:refs/remotes/origin/$BASE"

      - name: Preserve review tooling from base branch
        run: |
          mkdir -p /tmp/bunny-review-tool/scripts
          mkdir -p /tmp/bunny-review-tool/skills/bunny-review
          git show "origin/$PR_BASE_REF:scripts/bunny_review.py" > /tmp/bunny-review-tool/scripts/bunny_review.py
          git show "origin/$PR_BASE_REF:scripts/requirements.txt" > /tmp/bunny-review-tool/scripts/requirements.txt
          git show "origin/$PR_BASE_REF:skills/bunny-review/SKILL.md" > /tmp/bunny-review-tool/skills/bunny-review/SKILL.md

      - name: Fetch PR and checkout head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git status
          git fetch origin "pull/$PR_NUM/head:pr-$PR_NUM"
          git checkout "pr-$PR_NUM"

      - name: Detect previous Bunny review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr view "$PR_NUM" --json comments --jq '[.comments[] | select(.body | startswith("## Bunny Review"))] | length')
          if [ "${EXISTING:-0}" -gt 0 ]; then
            echo "BUNNY_OMIT_CHANGE_SUMMARY=true" >> "$GITHUB_ENV"
          else
            echo "BUNNY_OMIT_CHANGE_SUMMARY=false" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r /tmp/bunny-review-tool/scripts/requirements.txt

      - name: Run review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: gpt-5.5
          CI_STATUS: CI checks are still running; final CI results will be appended before posting.
          BUNNY_REVIEW_SKILL_PATH: /tmp/bunny-review-tool/skills/bunny-review/SKILL.md
        run: python /tmp/bunny-review-tool/scripts/bunny_review.py

      - name: Wait for CI status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(gh pr view "$PR_NUM" --json headRefOid -q .headRefOid)
          TARGET_CHECKS='Frontend|Rust|Smoke'
          for attempt in $(seq 1 90); do
            FOUND=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" \
              --jq ".check_runs | map(select(.name | test(\"$TARGET_CHECKS\"))) | length")
            PENDING=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" \
              --jq ".check_runs | map(select(.name | test(\"$TARGET_CHECKS\") and .status != \"completed\")) | length")
            if [ "${FOUND:-0}" -ge 3 ] && [ "${PENDING:-0}" -eq 0 ]; then
              break
            fi
            sleep 10
          done

          {
            echo ""
            echo "### CI Status"
            FINAL_CHECKS=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" \
              --jq ".check_runs | map(select(.name | test(\"$TARGET_CHECKS\"))) | map(\"- \(.name): \(.conclusion // .status)\") | join(\"\n\")")
            if [ -z "$FINAL_CHECKS" ]; then
              echo "- No Frontend, Rust, or Smoke checks were found before Bunny posted."
            else
              echo "$FINAL_CHECKS"
            fi
          } > /tmp/bunny-ci-status.md

      - name: Add CI status to review
        run: cat /tmp/bunny-ci-status.md >> review.md

      - name: Post the review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "$PR_NUM" --body-file review.md
