name: Dottore Review Auto Dispatch

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

# A title or description edit never dispatches, so it gets a group of its own: sharing the PR's group would cancel the
# dispatch of a push made just before it. Pushes and base changes still supersede each other.
concurrency:
  group: dottore-review-auto-dispatch-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base.ref.from && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dottore dispatch
    # Reviews start on request (/dottore) unless DOTTORE_AUTO_REVIEW is true. A bot's push may be Dottore's own repair,
    # whose review the step below lets through: whoever asked for the repair gets the review that checks it.
    if: >
      (vars.DOTTORE_AUTO_REVIEW == 'true' || (github.event.action == 'synchronize' && github.event.sender.type == 'Bot')) &&
      !github.event.pull_request.draft &&
      contains(format(',{0},', vars.DOTTORE_BASE_REFS || 'refactor,main,staging'), format(',{0},', github.event.pull_request.base.ref))
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted Dottore reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REQUESTED_BY: ${{ github.event.sender.login }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PREVIOUS_BASE_REF: ${{ github.event.changes.base.ref.from }}
          DOTTORE_BASE_REFS: ${{ vars.DOTTORE_BASE_REFS || 'refactor,main,staging' }}
          AUTO_REVIEW: ${{ vars.DOTTORE_AUTO_REVIEW == 'true' }}
        run: |
          # This pull_request_target workflow is intentionally a dispatcher only.
          # It must not checkout, install, or execute code from the pull request.
          TARGET_REF="$PR_BASE_REF"
          if [ "$AUTO_REVIEW" != true ] && [ "$(gh api "repos/${{ github.repository }}/commits/$PR_HEAD_SHA" \
            --jq '.commit.message | test("(^|\n)Dottore-Autofix: ")')" != true ]; then
            echo "Dottore examines on request: comment /dottore. This push is not a Dottore repair (DOTTORE_AUTO_REVIEW is off)."
            exit 0
          fi
          if [ "$PR_IS_DRAFT" != "false" ]; then
            echo "Draft specimen withheld from automatic examination."
            exit 0
          fi
          if ! jq -en --arg refs "$DOTTORE_BASE_REFS" --arg ref "$TARGET_REF" '$refs | split(",") | index($ref) != null' >/dev/null; then
            # Not a failure of the pull request: Dottore examines pull requests into the bases DOTTORE_BASE_REFS names.
            echo "::notice::Dottore does not examine pull requests into $TARGET_REF (DOTTORE_BASE_REFS=$DOTTORE_BASE_REFS)."
            exit 0
          fi
          REVIEW_MODE=auto

          if [ "$EVENT_ACTION" = "edited" ] && [ -z "$PREVIOUS_BASE_REF" ]; then
            echo "Skipping Dottore auto dispatch for pull request metadata edit."
            exit 0
          fi

          if [ "$EVENT_ACTION" = "edited" ] && [ -n "$PREVIOUS_BASE_REF" ]; then
            echo "Base ref changed from $PREVIOUS_BASE_REF to $PR_BASE_REF; dispatching a full examination against the new base."
            REVIEW_MODE=full
          else
            # Markers are read from the walkthrough's leading marker lines only; the rest is model-written text.
            REVIEW_HEADER="$(gh api "repos/${{ github.repository }}/issues/$PR_NUM/comments?per_page=100" \
              --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- dottore:walkthrough -->")) | (.body | split("\n")) as $l | $l[:($l | map(startswith("<!-- dottore:") | not) | index(true) // length)] | select(any(.[]; test("^<!-- dottore:last-reviewed-sha=[0-9a-f]{40} -->$"))) | @json' \
              | tail -n 1)"
            LAST_REVIEWED_SHA="$(jq -r '.[]' <<< "${REVIEW_HEADER:-[]}" \
              | sed -n 's/.*<!-- dottore:last-reviewed-sha=\([0-9a-f]\{40\}\) -->.*/\1/p' \
              | tail -n 1)"
            REVIEWED_BASE_REF="$(jq -r '.[]' <<< "${REVIEW_HEADER:-[]}" \
              | sed -n 's/^<!-- dottore:base-ref=\(.*\) -->$/\1/p' \
              | tail -n 1)"
            if [ -n "$LAST_REVIEWED_SHA" ] && [ "$REVIEWED_BASE_REF" != "$PR_BASE_REF" ]; then
              # A retarget made while draft never dispatched; older checkpoints also lack this identity.
              echo "Recorded review base '${REVIEWED_BASE_REF:-unknown}' differs from $PR_BASE_REF; dispatching a full examination."
              REVIEW_MODE=full
              LAST_REVIEWED_SHA=""
            # A partially judged review records its head too; let the reviewer finish its carried candidates.
            elif [ -n "$LAST_REVIEWED_SHA" ] && [ "$LAST_REVIEWED_SHA" = "$PR_HEAD_SHA" ] && \
              ! jq -e 'any(.[]; test("^<!-- dottore:unjudged=[A-Za-z0-9_=-]+ -->$"))' <<< "$REVIEW_HEADER" >/dev/null; then
              echo "Skipping Dottore auto dispatch because head $PR_HEAD_SHA was already reviewed."
              exit 0
            fi
          fi

          gh api "repos/${{ github.repository }}/contents/.github/workflows/dottore-review.yml?ref=$TARGET_REF" --silent >/dev/null || {
            echo "::error::Dottore trusted workflow not found on base ref $TARGET_REF"
            exit 1
          }

          gh workflow run dottore-review.yml \
            --repo "${{ github.repository }}" \
            --ref "$TARGET_REF" \
            -f pr_number="$PR_NUM" \
            -f comment_body="auto pull_request_target dispatch" \
            -f review_mode="$REVIEW_MODE" \
            -f requested_by="$REQUESTED_BY" \
            -f last_reviewed_sha="${LAST_REVIEWED_SHA:-}"
