client:
  - changed-files:
      - any-glob-to-any-file:
          - packages/client/**

server:
  - changed-files:
      - any-glob-to-any-file:
          - packages/server/**

shared:
  - changed-files:
      - any-glob-to-any-file:
          - packages/shared/**

android:
  - changed-files:
      - any-glob-to-any-file:
          - android/**

windows:
  - changed-files:
      - any-glob-to-any-file:
          - win/**
          - MarinaraLauncher.exe
          - start.bat

# Documentation people read: the guides, the top-level Markdown files and the Android README. Other Markdown, such as
# Professor Mari's skill files and .github/plans/, is not documentation.
docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "*.md"
          - android/README.md

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

container:
  - changed-files:
      - any-glob-to-any-file:
          - docker-compose.yml
          - Dockerfile
          - Dockerfile.lite

# Dependabot pull requests also match by branch, so sync-labels keeps the label on GitHub Actions and Gradle updates.
dependencies:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - pnpm-lock.yaml
              - "**/package.json"
      - head-branch: ["^dependabot/"]
