version: 2

# Each update sets `labels` so its pull requests get only `dependencies`, not Dependabot's default of `dependencies`
# plus a language label.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: gradle
    directory: /android
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
