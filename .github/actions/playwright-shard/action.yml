name: Run one Playwright shard
description: >-
  Set up pnpm/Node, restore the Playwright browser and Ubuntu package caches,
  and run one shard of one browser project. Each shard job runs on its own
  runner with its own app servers, which is what makes sharding safe despite
  fullyParallel: false —
  that setting guards test isolation within ONE run's shared servers, and
  shards never share a run (#5622).
inputs:
  project:
    description: Playwright project name (desktop-chromium, mobile-chromium, mobile-webkit)
    required: true
  browser:
    description: Browser bundle to install (chromium, webkit)
    required: true
  shard:
    description: 1-based shard index
    required: true
  total-shards:
    description: Total shard count
    required: true
  server-project:
    description: Which app-server pair the tests talk to (desktop or mobile) — the other pair is not booted (#5637)
    required: true
  smoke:
    description: Run the small desktop smoke suite instead of a full regression shard
    required: false
    default: "false"
  global-timeout-minutes:
    description: >-
      Total setup and shard budget (0 = no limit). Callers may start the clock before checkout with
      PLAYWRIGHT_SHARD_STARTED_AT. Keep it below the job timeout to leave time for reports and evidence.
    required: false
    default: "0"
runs:
  using: composite
  steps:
    - name: Start shard budget
      shell: bash
      run: echo "PLAYWRIGHT_SHARD_STARTED_AT=${PLAYWRIGHT_SHARD_STARTED_AT:-$(date +%s)}" >> "$GITHUB_ENV"

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browser }}-${{ steps.playwright-version.outputs.version }}

    # The Ubuntu packages are cached per runner image, which changes about weekly:
    # the first shard on a new image downloads them from the mirror and saves them.
    - name: Resolve runner image
      id: runner-image
      shell: bash
      run: echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore ${{ inputs.browser }} Ubuntu packages
      id: os-packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/playwright-debs
        key: playwright-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.image }}-${{ inputs.browser }}-${{ steps.playwright-version.outputs.version }}

    - name: Install ${{ inputs.browser }}
      id: install-browser
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install-browser.sh" ${{ inputs.browser }} "$RUNNER_TEMP/playwright-debs"

    - name: Save ${{ inputs.browser }} Ubuntu packages
      if: steps.install-browser.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/playwright-debs
        key: ${{ steps.os-packages.outputs.cache-primary-key }}

    - name: Run Chromium smoke suite
      if: inputs.smoke == 'true'
      shell: bash
      env:
        PLAYWRIGHT_ONLY_PROJECT: desktop
      run: pnpm smoke:ui

    - name: Run ${{ inputs.project }} shard ${{ inputs.shard }}/${{ inputs.total-shards }}
      if: inputs.smoke != 'true'
      # --fully-parallel changes only the SHARDING granularity: with the
      # config's fullyParallel:false the whole single-file suite is one
      # indivisible group and every test lands in shard 1. Pairing it with
      # --workers=1 keeps execution inside each shard strictly serial in file
      # order, so tests never run concurrently against the shard's servers —
      # the property fullyParallel:false exists to protect.
      shell: bash
      env:
        PLAYWRIGHT_ONLY_PROJECT: ${{ inputs.server-project }}
        GLOBAL_TIMEOUT_MINUTES: ${{ inputs.global-timeout-minutes }}
      run: |
        timeout_ms=0
        if (( GLOBAL_TIMEOUT_MINUTES > 0 )); then
          elapsed_seconds=$(( $(date +%s) - PLAYWRIGHT_SHARD_STARTED_AT ))
          if (( elapsed_seconds < 0 )); then elapsed_seconds=0; fi
          timeout_ms=$(( GLOBAL_TIMEOUT_MINUTES * 60000 - elapsed_seconds * 1000 ))
          if (( timeout_ms <= 0 )); then
            echo "::error::The shard budget was exhausted during setup." >&2
            exit 1
          fi
        fi
        pnpm exec playwright test -c playwright.config.ts \
          --project=${{ inputs.project }} \
          --fully-parallel --workers=1 \
          --global-timeout="$timeout_ms" \
          --shard=${{ inputs.shard }}/${{ inputs.total-shards }}
