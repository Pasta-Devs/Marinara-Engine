<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Professor Mari · round 4 · window fixes</title>
<style>
@font-face { font-family: "Inter"; src: url(../mari-v3/fonts/Inter-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Inter"; src: url(../mari-v3/fonts/Inter-SemiBold.woff2) format("woff2"); font-weight: 500 700; font-display: swap; }

/* ─── App tokens (packages/client/src/styles/globals.css, as copied for mockups/mari-v3) ─── */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --background: #050312; --foreground: #d4d4d4; --card: #141414d9; --primary: #ec4b97;
  --muted-foreground: #a1a1aa; --accent: #2a1a3e; --destructive: #ff6b9d;
  --border: color-mix(in srgb, var(--primary) 20%, transparent); --ring: var(--primary);
  --mari-logo-cyan: #4de5dd; --mari-logo-orange: #eb8951; --mari-logo-pink: #e15c8c;
  --strong: #f4f4f5; --hairline: color-mix(in srgb, var(--foreground) 13%, transparent);
  --surface-2: color-mix(in srgb, var(--foreground) 8%, var(--background));
  --hover: color-mix(in srgb, var(--foreground) 7%, transparent);
  --group-bg: color-mix(in srgb, var(--foreground) 3.5%, var(--background));
  --divider: color-mix(in srgb, var(--foreground) 8%, transparent);
  --ins-bg: color-mix(in srgb, #34d399 16%, transparent); --ins-line: #34d399; --ok: #6ee7b7;
  --danger-fill: #dc2626; --danger-text: #fca5a5;
  --code-bg: color-mix(in srgb, var(--foreground) 10%, transparent);
  --mari-gold: oklch(0.82 0.11 79); --mari-gold-text: var(--mari-gold);
  --mari-hoodie: oklch(0.62 0.1 252); --mari-blush: oklch(0.76 0.14 344);
  --canvas: color-mix(in srgb, var(--background) 94%, oklch(0.22 0.035 326));
  --composer-bg: color-mix(in srgb, var(--card) 88%, transparent);
  --font: "Straight Quotes", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
[data-theme="light"] {
  color-scheme: light;
  --background: #faf8ff; --foreground: #1a1025; --card: #ffffffee; --muted-foreground: #65656f; --accent: #ede4f7;
  --destructive: #c44040; --border: color-mix(in srgb, var(--primary) 27%, transparent);
  --strong: #120a1c; --hairline: color-mix(in srgb, var(--foreground) 12%, transparent);
  --surface-2: color-mix(in srgb, var(--foreground) 5%, #ffffff); --hover: color-mix(in srgb, var(--foreground) 6%, transparent);
  --group-bg: #fff; --divider: color-mix(in srgb, var(--foreground) 7%, transparent);
  --ins-bg: color-mix(in srgb, #10b981 15%, transparent); --ins-line: #059669; --ok: #047857;
  --danger-fill: var(--destructive); --danger-text: #b42318;
  /* Fix found in the light screenshots: inline code was white-on-white. */
  --code-bg: color-mix(in srgb, var(--foreground) 7%, transparent);
  --mari-gold-text: oklch(0.55 0.11 70);
  --canvas: color-mix(in srgb, var(--background) 96%, oklch(0.93 0.025 73));
  --composer-bg: color-mix(in srgb, #fff 82%, transparent);
}
@font-face { font-family: "Straight Quotes"; src: local("Arial"), local("Helvetica"); unicode-range: U+0022, U+0027; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--background); color: var(--foreground); font: 0.875rem/1.6 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg { flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ─── Home behind the omnibar (stand-in; the real app is under the 55% black backdrop) ─── */
.app { position: fixed; inset: 0; display: grid; grid-template-rows: 3rem 2.75rem 1fr; }
.app-top { display: flex; align-items: center; gap: 0.75rem; padding: 0 1rem; border-bottom: 1px solid var(--border); }
.app-dot { width: 1.1rem; height: 1.1rem; border-radius: 0.3rem; background: color-mix(in srgb, var(--foreground) 22%, transparent); }
.app-dot--p { background: color-mix(in srgb, var(--primary) 55%, transparent); }
.app-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; padding: 1rem; }
.app-card { border: 1px solid color-mix(in srgb, var(--mari-logo-cyan) 30%, transparent); border-radius: 1rem; background: color-mix(in srgb, var(--mari-logo-cyan) 6%, var(--background)); }

/* ─── Omnibar overlay + panel (GlobalOmnibar.tsx: fixed z-100, bg-black/55, blur) ─── */
.overlay { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: center; align-items: flex-start; padding: 10vh 1.5rem 0; background: rgb(0 0 0 / 0.55); backdrop-filter: blur(8px); }
.panel { position: relative; isolation: isolate; display: flex; flex-direction: column; width: min(72rem, 100%); height: min(45rem, 80dvh); overflow: hidden; border-radius: 1rem; background: var(--canvas); box-shadow: 0 24px 60px -12px rgb(0 0 0 / 0.55), 0 0 0 1px color-mix(in srgb, var(--border) 60%, transparent); }

/* Phone frame (390 x 844): the real omnibar is full screen there */
body.phone .app { display: none; }
body.phone .overlay { padding: 0.75rem 0 0; align-items: flex-start; background: #000; }
body.phone .panel { width: 390px; height: min(844px, calc(100dvh - 5.5rem)); border-radius: 2rem; }
body.phone .mhead .dest .lbl-long { display: none; }

/* ─── M8: ONE header row in Mari mode. No portrait, no "Professor Mari / Working on it" - she is in the transcript. ─── */
.mhead { position: relative; z-index: 5; display: flex; align-items: center; gap: 0.25rem; height: 3rem; padding: 0 0.5rem; border-bottom: 1px solid color-mix(in srgb, var(--mari-blush) 16%, var(--border)); }
.icon-btn { display: inline-grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: 0.45rem; color: var(--muted-foreground); }
.icon-btn:hover { background: var(--hover); color: var(--foreground); }
.dest { display: flex; flex: 1; justify-content: safe center; gap: 0.15rem; overflow-x: auto; scrollbar-width: none; }
.dest button { display: inline-flex; align-items: center; gap: 0.35rem; min-height: 2.25rem; padding: 0 0.6rem; border-radius: 0.5rem; color: var(--muted-foreground); font-size: 0.75rem; font-weight: 500; white-space: nowrap; }
.dest button:hover { color: var(--foreground); background: var(--hover); }
.dest button[aria-pressed="true"] { color: var(--strong); background: var(--hover); }
.dest b { min-width: 1.1rem; padding: 0 0.3rem; border-radius: 999px; background: var(--surface-2); font-size: 0.625rem; text-align: center; }
@media (pointer: coarse) { .icon-btn, .dest button { min-width: 2.75rem; min-height: 2.75rem; } }

/* ─── Body: main column + optional side panel ─── */
.body { position: relative; display: flex; flex: 1; min-height: 0; }
.main { position: relative; flex: 1; min-width: 0; }

/* M1/M2: the transcript fills the whole main area and scrolls UNDER the composer. One always-on mask fades it
   into the header and into the composer; there is no opaque dock box and no mask that toggles while scrolling. */
.transcript { --dock: 7.5rem; position: absolute; inset: 0; z-index: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; scrollbar-width: thin;
  mask-image: linear-gradient(to bottom, transparent 0, #000 2rem, #000 calc(100% - var(--dock) - 2.5rem), transparent calc(100% - var(--dock) + 1.25rem));
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 2rem, #000 calc(100% - var(--dock) - 2.5rem), transparent calc(100% - var(--dock) + 1.25rem)); }
.stack { display: flex; flex-direction: column; gap: 1.25rem; width: 100%; max-width: 44rem; margin-inline: auto; padding: 1.75rem 1.5rem var(--dock); }
body.phone .stack { padding-inline: 1rem; }

/* Glow band: under everything in the main column, so it shows through the faded edge instead of being a box. */
.glow { position: absolute; z-index: 0; left: 50%; bottom: -3.5rem; width: max(100%, 48rem); height: 10rem; border-radius: 50%; translate: -50% 0; pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
  background: linear-gradient(90deg, var(--mari-logo-cyan), oklch(0.68 0.16 280) 30%, var(--mari-logo-pink) 60%, var(--mari-logo-orange)); filter: blur(2.25rem); }
.main[data-working="true"] .glow { opacity: 0.42; animation: waver 4.2s ease-in-out infinite alternate; }
.main[data-working="ending"] .glow { background: linear-gradient(90deg, oklch(0.78 0.08 158), oklch(0.82 0.07 172)); opacity: 0; transition: opacity 3s ease; }
@keyframes waver { 50% { scale: 1.01 1.12; } }
html[data-reduce="true"] .glow { display: none; }

/* Composer: the only surface at the bottom - translucent card + blur. No dock background. */
.dock { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 0 1.5rem 1rem; pointer-events: none; }
.dock > * { pointer-events: auto; }
.dock-inner { max-width: 44rem; margin-inline: auto; }
body.phone .dock { padding: 0 0.75rem max(0.75rem, env(safe-area-inset-bottom)); }
.composer { display: grid; gap: 0.4rem; padding: 0.6rem 0.65rem 0.5rem 0.9rem; border: 1px solid var(--hairline); border-radius: 1.25rem; background: var(--composer-bg); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 0.75rem 2rem -1.25rem rgb(0 0 0 / 0.6); transition: opacity 0.3s ease; }
.composer textarea { width: 100%; min-height: 1.6rem; max-height: 8rem; resize: none; border: 0; outline: 0; background: none; font-size: 0.9375rem; }
.composer textarea::placeholder { color: color-mix(in srgb, var(--foreground) 35%, transparent); }
.toolbar { display: flex; align-items: center; gap: 0.35rem; }
.chip { display: inline-flex; align-items: center; gap: 0.35rem; height: 1.75rem; padding: 0 0.6rem; border: 1px solid var(--hairline); border-radius: 999px; color: var(--muted-foreground); font-size: 0.6875rem; font-weight: 600; white-space: nowrap; }
.chip:hover { color: var(--foreground); background: var(--hover); }
.send { display: inline-grid; place-items: center; width: 2rem; height: 2rem; margin-left: auto; border-radius: 999px; background: var(--strong); color: var(--background); }
.stop { margin-left: auto; display: none; align-items: center; gap: 0.35rem; height: 2rem; padding: 0 0.75rem; border-radius: 999px; background: var(--surface-2); color: var(--strong); font-size: 0.75rem; font-weight: 600; }
.main[data-working="true"] .send { display: none; }
.main[data-working="true"] .stop { display: inline-flex; }
@media (pointer: coarse) { .chip, .send, .stop { min-height: 2.75rem; } .send { width: 2.75rem; } }

/* M7: "What Mari sees" - the facts that go with the next message, as removable chips above the text. */
.sees { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; }
.sees:empty { display: none; }
.sees-label { font-size: 0.6875rem; color: var(--muted-foreground); margin-right: 0.15rem; }
.see { display: inline-flex; align-items: center; gap: 0.3rem; height: 1.6rem; max-width: 16rem; padding: 0 0.25rem 0 0.5rem; border-radius: 0.5rem; background: var(--surface-2); font-size: 0.6875rem; font-weight: 500; }
.see span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.see svg { color: var(--muted-foreground); }
.see button { display: inline-grid; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: 0.35rem; color: var(--muted-foreground); }
.see button:hover { background: var(--hover); color: var(--foreground); }
.see[data-later="true"] { background: none; box-shadow: inset 0 0 0 1px var(--hairline); }
@media (pointer: coarse) { .see { height: 2.25rem; } .see button { width: 2.25rem; height: 2.25rem; } }

/* ─── Transcript content (direction A) ─── */
.user { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; scroll-margin-top: 1rem; }
.user .bubble { max-width: min(85%, 36rem); padding: 0.55rem 0.9rem; border-radius: 1.25rem 1.25rem 0.375rem 1.25rem; background: color-mix(in srgb, var(--foreground) 7%, var(--card)); }
.user .facets { display: flex; gap: 0.6rem; font-size: 0.6875rem; color: var(--muted-foreground); }
.turn { display: flex; flex-direction: column; gap: 1rem; }
.md { margin: 0; max-width: 64ch; }
.md h3 { margin: 0.75rem 0 0.25rem; font-size: 0.9375rem; color: var(--strong); }
.md p { margin: 0 0 0.6rem; }
.md strong { color: var(--strong); font-weight: 600; }
.md code { padding: 0.05rem 0.3rem; border-radius: 0.3rem; background: var(--code-bg); font: 0.75rem/1.4 ui-monospace, Consolas, monospace; }
.w { animation: word-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
@keyframes word-in { from { opacity: 0; filter: blur(3px); } }

/* M5: a structured run. Goal → phases (each folds to one line) → answer → what changed / needs your OK → worked-for.
   Every block is appended once and never moved; finished rows do not use layout animation. */
.run { display: flex; flex-direction: column; gap: 0.6rem; }
.goal { display: flex; align-items: baseline; gap: 0.5rem; font-size: 0.8125rem; color: var(--muted-foreground); }
.goal b { color: var(--foreground); font-weight: 600; }
.kicker { font-size: 0.625rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-foreground); }
.phase > summary { display: flex; align-items: center; gap: 0.5rem; width: fit-content; min-height: 1.9rem; padding: 0.1rem 0.5rem; margin-left: -0.5rem; border-radius: 0.5rem; list-style: none; cursor: pointer; color: var(--muted-foreground); font-size: 0.8125rem; }
.phase > summary::-webkit-details-marker { display: none; }
.phase > summary:hover { background: var(--hover); color: var(--foreground); }
.phase > summary .count { font-variant-numeric: tabular-nums; font-size: 0.6875rem; opacity: 0.8; }
.phase .chev { transition: transform 0.16s ease; opacity: 0.7; }
.phase[open] > summary .chev { transform: rotate(90deg); }
.phase ol { list-style: none; margin: 0.1rem 0 0.2rem 0.4rem; padding: 0 0 0 0.85rem; border-left: 1px solid var(--hairline); }
.phase li { display: flex; align-items: center; gap: 0.5rem; min-height: 1.75rem; font-size: 0.8125rem; color: var(--muted-foreground); animation: step-in 0.3s ease both; }
.phase li .q { color: var(--foreground); }
.phase li .dur { font-size: 0.6875rem; font-variant-numeric: tabular-nums; opacity: 0.75; }
@keyframes step-in { from { opacity: 0; } }
.phase[data-state="live"] > summary { color: var(--foreground); }

.outcome { border: 1px solid var(--hairline); border-radius: 0.875rem; background: var(--group-bg); overflow: hidden; animation: step-in 0.35s ease both; }
.outcome .sec { padding: 0.15rem 0; }
.outcome .sec + .sec { border-top: 1px solid var(--divider); }
.outcome .kicker { display: block; padding: 0.6rem 0.9rem 0.1rem; }
.orow { display: flex; align-items: center; gap: 0.75rem; min-height: 3rem; padding: 0.45rem 0.9rem; }
.orow .t { flex: 1; min-width: 0; line-height: 1.35; }
.orow .t b { display: block; font-size: 0.8125rem; color: var(--strong); font-weight: 600; }
.orow .t span { font-size: 0.75rem; color: var(--muted-foreground); }
.av { display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border-radius: 0.6rem; background: oklch(0.34 0.045 calc(var(--h) * 1deg)); color: oklch(0.87 0.07 calc(var(--h) * 1deg)); font-size: 0.7rem; font-weight: 600; }
[data-theme="light"] .av { background: oklch(0.94 0.03 calc(var(--h) * 1deg)); color: oklch(0.44 0.09 calc(var(--h) * 1deg)); }
.btn, .link { display: inline-flex; align-items: center; height: 1.875rem; padding: 0 0.7rem; border-radius: 0.5rem; font-size: 0.8125rem; font-weight: 600; white-space: nowrap; }
.btn { border: 1px solid var(--hairline); color: var(--strong); }
.btn:hover, .link:hover { background: var(--hover); }
.btn--danger { background: var(--danger-fill); color: #fff; border-color: transparent; }
.link { color: var(--muted-foreground); }
@media (pointer: coarse) { .btn, .link { min-height: 2.75rem; } }
body.phone .orow { flex-wrap: wrap; } body.phone .orow .acts { width: 100%; display: flex; justify-content: flex-end; }

/* ─── Things you read and act on (approved v3 language + the real app's .mari-ref-card) ─── */
.lead { margin: 0; max-width: 60ch; font-size: 0.9375rem; line-height: 1.55; color: var(--foreground); }
.lead b { color: var(--strong); font-weight: 600; }
/* Reference pills: what her answer is about (globals.css .mari-ref-card) */
.refs { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.ref { display: flex; align-items: center; gap: 0.55rem; max-width: 15rem; padding: 0.3rem 0.8rem 0.3rem 0.3rem; border: 1px solid color-mix(in srgb, var(--foreground) 10%, transparent); border-radius: 999px; background: color-mix(in srgb, var(--card) 75%, transparent); text-align: left; animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.ref:hover { background: color-mix(in srgb, var(--foreground) 6%, var(--card)); }
.mono { display: grid; place-items: center; width: 2rem; height: 2rem; flex: none; border-radius: 999px; background: linear-gradient(150deg, oklch(0.6 0.13 calc(var(--h) * 1deg)), oklch(0.36 0.09 calc(var(--h) * 1deg + 40deg))); color: oklch(0.97 0.02 calc(var(--h) * 1deg)); font-size: 0.75rem; font-weight: 700; }
.ref .cap { display: grid; min-width: 0; line-height: 1.2; }
.ref .cap b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.8125rem; color: var(--foreground); }
.ref .cap span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.6875rem; color: var(--muted-foreground); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); filter: blur(3px); } }

/* One group of hairline rows: changed / created / needs your OK. Short title, one meta line, small actions. */
.group { border: 1px solid var(--hairline); border-radius: 0.875rem; background: var(--group-bg); overflow: hidden; }
[data-theme="light"] .group { box-shadow: 0 1px 2px rgb(26 16 37 / 0.04), 0 4px 16px -8px rgb(26 16 37 / 0.08); }
.grow + .grow { border-top: 1px solid var(--divider); }
.grow { animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: calc(var(--i, 0) * 80ms); }
.ghead { display: flex; align-items: center; gap: 0.75rem; width: 100%; min-height: 3.5rem; padding: 0.55rem 0.9rem 0.55rem 0.75rem; text-align: left; }
.gtoggle { display: flex; flex: 1; min-width: 0; align-items: center; gap: 0.75rem; min-height: 2.6rem; margin: -0.3rem 0 -0.3rem -0.35rem; padding: 0.3rem 0.35rem; border-radius: 0.6rem; text-align: left; }
.gtoggle:hover { background: color-mix(in srgb, var(--foreground) 4%, transparent); }
.ghead .t { flex: 1; min-width: 0; display: grid; line-height: 1.35; }
.ghead .t b { display: flex; align-items: center; gap: 0.45rem; font-size: 0.8125rem; font-weight: 600; color: var(--strong); }
.ghead .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.75rem; color: var(--muted-foreground); }
.gend { display: inline-flex; align-items: center; gap: 0.35rem; flex: none; font-size: 0.75rem; font-weight: 500; color: var(--muted-foreground); }
.gend .ok { color: var(--ok); }
.grow[data-open="true"] .gend .chev { transform: rotate(90deg); }
.gend .chev { transition: transform 0.16s ease; }
.badge { padding: 0.05rem 0.4rem; border-radius: 999px; font-size: 0.625rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--mari-gold-text); background: color-mix(in srgb, var(--mari-gold) 15%, transparent); }
.gbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.33, 1, 0.68, 1); }
.gbody > div { min-height: 0; overflow: hidden; }
.grow[data-open="true"] .gbody { grid-template-rows: 1fr; }
.gin { display: grid; gap: 0.8rem; padding: 0 0.9rem 0.85rem 3.6rem; }
body.phone .gin { padding-left: 0.9rem; }
.field { display: grid; gap: 0.25rem; }
.flabel { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-foreground); }
.ftext { margin: 0; font-size: 0.8125rem; line-height: 1.6; }
del { color: var(--muted-foreground); text-decoration: line-through 1px; }
ins { text-decoration: underline 1px var(--ins-line); text-underline-offset: 3px; background: var(--ins-bg); color: var(--strong); border-radius: 2px; padding: 0 1px; }
.tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.tag { display: inline-flex; align-items: center; height: 1.375rem; padding: 0 0.5rem; border-radius: 999px; font-size: 0.6875rem; font-weight: 500; background: var(--surface-2); }
.tag--del { background: none; box-shadow: inset 0 0 0 1px var(--hairline); color: var(--muted-foreground); text-decoration: line-through; }
.tag--del::before { content: "−"; margin-right: 3px; }
.tag--ins { background: var(--ins-bg); color: var(--strong); }
.tag--ins::before { content: "+"; margin-right: 3px; color: var(--ok); font-weight: 600; }
.gacts { display: flex; justify-content: flex-end; gap: 0.4rem; flex-wrap: wrap; }
.decision .ghead { align-items: flex-start; min-height: 0; padding-bottom: 0.2rem; }
.decision .gin { padding-top: 0.1rem; gap: 0.6rem; }
.keymap { display: grid; grid-template-columns: repeat(3, max-content); justify-content: start; gap: 0.25rem 0.6rem; align-items: center; font-size: 0.75rem; }
.keymap .arrow { color: var(--muted-foreground); }
.why > summary { list-style: none; display: inline-flex; align-items: center; gap: 0.35rem; min-height: 1.75rem; padding: 0 0.45rem; margin-left: -0.45rem; border-radius: 0.4rem; font-size: 0.75rem; font-weight: 600; color: var(--muted-foreground); cursor: pointer; }
.why > summary::-webkit-details-marker { display: none; }
.why > summary:hover { background: var(--hover); color: var(--strong); }
.why[open] > summary .chev { transform: rotate(90deg); }
.why ul { margin: 0.3rem 0 0; padding-left: 1.1rem; font-size: 0.8125rem; color: var(--muted-foreground); }

/* Suggestion cards: the next step, as cards with a fact. ✦ = asks Mari, → = does it right away (no model). */
.next { display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: 0.5rem; }
.scard { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.6rem; align-items: start; min-height: 3.75rem; padding: 0.65rem 0.75rem; border: 1px solid var(--hairline); border-radius: 0.875rem; background: color-mix(in srgb, var(--group-bg) 80%, transparent); text-align: left; transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease; animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.scard:hover { background: color-mix(in srgb, var(--foreground) 5%, var(--group-bg)); border-color: color-mix(in srgb, var(--foreground) 20%, transparent); transform: translateY(-1px); }
.scard .si { grid-row: span 2; display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 0.55rem; background: var(--surface-2); color: var(--muted-foreground); }
.scard b { font-size: 0.8125rem; font-weight: 600; color: var(--strong); line-height: 1.35; padding-right: 1rem; }
.scard span.f { font-size: 0.75rem; color: var(--muted-foreground); line-height: 1.35; }
.scard .kind { position: absolute; top: 0.6rem; right: 0.65rem; font-size: 0.75rem; color: var(--muted-foreground); }
.scard[data-kind="mari"] .kind { color: var(--mari-gold-text); }
.scard[data-tone="fix"] .si { background: color-mix(in srgb, var(--danger-fill) 14%, transparent); color: var(--danger-text); }
body.phone .next { grid-template-columns: 1fr; }
@media (pointer: coarse) { .scard { min-height: 3.5rem; } }

/* The live line: one element for the whole run. It reserves its height (4.75rem) from the first frame, and on completion
   it changes into "Worked for…" in place - no unmount, no second timeline mounting from the reloaded message. */
.live { display: flex; align-items: center; gap: 0.6rem; min-height: 4.75rem; margin-left: -0.5rem; padding-inline: 0.5rem; color: var(--muted-foreground); }
.sprite { position: relative; width: 3rem; height: 4.5rem; flex: none; }
.sprite > span { position: absolute; inset: 0; background: var(--sheet) 0 center / 400% 100% no-repeat; image-rendering: pixelated; animation: story 4.8s step-end infinite; }
@keyframes story { 0%, 24% { background-position: 0 center; } 25%, 49% { background-position: 33.33% center; } 50%, 74% { background-position: 66.67% center; } 75%, 100% { background-position: 100% center; } }
.headline { flex: 1; min-width: 0; overflow: hidden; color: var(--foreground); font-size: 0.875rem; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
.headline .subj { color: var(--mari-gold-text); }
.timer { font-size: 0.6875rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.worked { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 2rem; padding: 0 0.6rem 0 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
.worked:hover { background: var(--hover); color: var(--foreground); }
.done-mark { width: 0.95rem; height: 0.95rem; fill: none; stroke: oklch(0.74 0.15 154); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* M9: Mari arrives with context - a deterministic first line and 2-4 actions. No model call until a click (R22). */
.arrive { display: flex; gap: 1rem; align-items: flex-end; margin-top: auto; animation: step-in 0.4s ease both; }
.arrive .copy { min-width: 0; flex: 1; display: grid; gap: 0.35rem; padding-bottom: 0.4rem; }
.arrive .line { margin: 0; font-size: 1rem; line-height: 1.45; color: var(--foreground); }
.arrive .line b { color: var(--strong); }
.arrive .meta { margin: 0; font-size: 0.75rem; color: var(--muted-foreground); }
.acts-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
.act { display: inline-flex; align-items: center; gap: 0.4rem; min-height: 2.25rem; padding: 0 0.8rem; border: 1px solid var(--hairline); border-radius: 999px; font-size: 0.8125rem; color: var(--foreground); text-align: left; }
.act:hover { background: var(--hover); }
.act svg { color: var(--muted-foreground); }
@media (pointer: coarse) { .act { min-height: 2.75rem; } }

/* ─── M6: side panels in the same surface language: canvas colour, one hairline, rows like Mari's own output ─── */
.side { width: 22rem; flex: none; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--hairline); background: var(--canvas); }
.side[hidden] { display: none; }
body.phone .side { position: absolute; inset: 0; z-index: 4; width: auto; border-left: 0; animation: sheet-in 0.24s cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes sheet-in { from { opacity: 0; transform: translateX(1rem); } }
.side-head { display: flex; align-items: center; gap: 0.5rem; min-height: 3.25rem; padding: 0.5rem 0.5rem 0.5rem 1rem; }
.side-head .t { flex: 1; min-width: 0; line-height: 1.3; }
.side-head .t b { display: block; font-size: 0.875rem; color: var(--strong); }
.side-head .t span { font-size: 0.75rem; color: var(--muted-foreground); }
.side-head .back { display: none; }
body.phone .side-head .back { display: inline-grid; } body.phone .side-head .close { display: none; }
.side-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0.75rem 1rem; display: grid; align-content: start; gap: 1rem; }
.sgroup { display: grid; gap: 0.3rem; }
.sgroup > .kicker { padding: 0 0.25rem; }
.rows { border: 1px solid var(--hairline); border-radius: 0.875rem; background: var(--group-bg); overflow: hidden; }
.srow { display: flex; align-items: center; gap: 0.65rem; min-height: 3rem; padding: 0.45rem 0.4rem 0.45rem 0.75rem; }
.srow + .srow { border-top: 1px solid var(--divider); }
.srow .t { flex: 1; min-width: 0; line-height: 1.35; }
.srow .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.8125rem; font-weight: 600; color: var(--strong); }
.srow .t span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.75rem; color: var(--muted-foreground); }
.srow[aria-current="true"] { background: var(--hover); }
.srow .more { opacity: 0; } .srow:hover .more, .srow:focus-within .more { opacity: 1; }
@media (pointer: coarse) { .srow .more { opacity: 1; } }
.ic { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 0.55rem; background: var(--surface-2); color: var(--muted-foreground); }
.note { margin: 0; padding: 0 0.25rem; font-size: 0.75rem; line-height: 1.5; color: var(--muted-foreground); }
.search { display: flex; align-items: center; gap: 0.5rem; height: 2.25rem; padding: 0 0.75rem; border-radius: 0.65rem; background: var(--surface-2); color: var(--muted-foreground); font-size: 0.8125rem; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; }
.addrow { display: flex; align-items: center; gap: 0.5rem; min-height: 2.5rem; padding: 0 0.75rem; color: var(--muted-foreground); font-size: 0.8125rem; font-weight: 500; width: 100%; }
.addrow:hover { color: var(--foreground); background: var(--hover); }

/* ─── Demo controls (as in mari-v3) ─── */
.demo { position: fixed; left: 1rem; bottom: 1rem; z-index: 400; display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem; max-width: calc(100vw - 2rem); padding: 0.25rem; border: 1px solid rgb(255 255 255 / 0.14); border-radius: 1rem; background: rgb(18 14 30 / 0.88); color: #e7e5ee; backdrop-filter: blur(10px); font-size: 0.75rem; font-weight: 600; }
.demo button { min-height: 2rem; padding: 0 0.7rem; border-radius: 999px; color: inherit; }
.demo button:hover { background: rgb(255 255 255 / 0.1); }
.demo button[aria-pressed="true"] { background: rgb(255 255 255 / 0.16); }
.demo .sep { width: 1px; height: 1rem; background: rgb(255 255 255 / 0.16); }
.caption { position: fixed; right: 1rem; bottom: 1rem; z-index: 400; max-width: 22rem; padding: 0.6rem 0.8rem; border-radius: 0.75rem; background: rgb(18 14 30 / 0.88); color: #e7e5ee; font-size: 0.75rem; line-height: 1.45; }
body.phone .caption { max-width: calc(50vw - 230px); }
@media (max-width: 70rem) { .caption { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
const $ = (s, r = document) => r.querySelector(s);
const root = document.documentElement;
const tx = $("#tx"), stack = $("#stack"), main = $("#main"), side = $("#side"), seesEl = $("#sees"), input = $("#input");
const ico = (id, s = 14) => `<svg width="${s}" height="${s}"><use href="#i-${id}"/></svg>`;
let speed = 1, timers = [];
const at = (ms, fn) => timers.push(setTimeout(fn, ms / speed));
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

/* ── Scroll rule (M4): on send, put the question at the top ONCE. Afterwards follow only while the reader is at
   the bottom. The active turn reserves the viewport height, so the answer grows into empty space and nothing
   collapses on completion; completion never scrolls. ── */
let following = false;
const dockH = () => $("#dock").offsetHeight;
const atBottom = () => tx.scrollHeight - tx.clientHeight - tx.scrollTop < 48;
tx.addEventListener("scroll", () => { following = atBottom(); }, { passive: true });
new ResizeObserver(() => { if (following) tx.scrollTop = tx.scrollHeight; }).observe(stack);
function placeQuestionAtTop(turn) {
  turn.style.minHeight = `${tx.clientHeight - dockH() - 24}px`; // ponytail: reserve = viewport; recompute on resize if it matters
  tx.scrollTo({ top: turn.offsetTop - 16, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  following = false; // the reader is at the question, not the bottom; following starts once the answer reaches the bottom
}
function syncDock() { tx.style.setProperty("--dock", `${dockH() + 8}px`); }
new ResizeObserver(syncDock).observe($("#dock"));

/* ── What Mari sees (M7) ── */
let sees = [];
function renderSees() {
  seesEl.innerHTML = sees.length ? `<span class="sees-label">Mari sees</span>` + sees.map((s, i) =>
    `<span class="see" data-later="${s.later ? "true" : "false"}" title="${s.title}">${ico(s.icon, 12)}<span>${s.label}</span><button type="button" aria-label="Remove ${s.label}" data-i="${i}">${ico("x", 11)}</button></span>`).join("") : "";
  $("#sees-count").textContent = String(sees.length);
  seesEl.querySelectorAll("button").forEach((b) => (b.onclick = () => { sees.splice(Number(b.dataset.i), 1); renderSees(); if (!side.hidden && side.dataset.kind === "sees") openSide("sees"); }));
}

/* ── Run script ── */
const sheet = (n) => `url(../mari-v3/img/story-${n}.png)`;
function liveLine() {
  const el = document.createElement("div");
  el.className = "live";
  el.innerHTML = `<span class="sprite" aria-hidden="true"><span style="--sheet:${sheet("thinking")}"></span></span><span class="headline" role="status">Reading your request</span><span class="timer">0s</span>`;
  return el;
}
function phase(title, icon) {
  const d = document.createElement("details");
  d.className = "phase"; d.open = true; d.dataset.state = "live";
  d.innerHTML = `<summary>${ico(icon)}<span class="ttl">${title}</span><span class="count"></span>${ico("chev", 11).replace("<svg", '<svg class="chev"')}</summary><ol></ol>`;
  return d;
}
function addStep(ph, verb, subject, secs) {
  const li = document.createElement("li");
  li.innerHTML = `${verb} <span class="q">${subject}</span> <span class="dur">${secs}s</span>`;
  ph.querySelector("ol").append(li);
  ph.querySelector(".count").textContent = String(ph.querySelectorAll("li").length);
}
function foldPhase(ph, summary) { ph.open = false; ph.dataset.state = "done"; ph.querySelector(".ttl").textContent = summary; ph.querySelector(".count").textContent = ""; }

// Cards with facts, never paragraphs. Spark ("mari") cards put a prompt in the composer; "do" cards act at once, no model.
const card = ([icon, title, fact, kind = "mari", tone = ""], i) =>
  `<button class="scard" type="button" data-kind="${kind}" data-tone="${tone}" style="--i:${i}"><span class="si">${ico(icon, 14)}</span><b>${title}</b><span class="f">${fact}</span><span class="kind" aria-label="${kind === "mari" ? "Asks Mari" : "Does it now"}">${kind === "mari" ? ico("spark", 12) : "→"}</span></button>`;
const ref = ([mono, h, name, tag], i) => `<button class="ref" type="button" style="--i:${i}"><span class="mono" style="--h:${h}">${mono}</span><span class="cap"><b>${name}</b><span>${tag}</span></span></button>`;
const NEXT = [
  ["chat", "Start a chat with Zylo", "Try the new greeting", "do"],
  ["pencil", "Write 2 alternate greetings", "Shown as a review first"],
  ["search", "Check the other 11 entries", "All fired in the last 20 messages"],
];
function streamHtml(target, html, startMs, perWord = 24) {
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  const blocks = [...tmp.children]; let t = startMs;
  blocks.forEach((b) => {
    const tag = document.createElement(b.tagName); target.append(tag);
    const words = b.innerHTML.split(/(\s+)/);
    let acc = "";
    words.forEach((w) => { t += perWord; at(t, () => { acc += w; tag.innerHTML = acc.replace(/(\S+)$/, '<span class="w">$1</span>'); }); });
    t += 120;
  });
  return t;
}

function sceneRun() {
  reset();
  sees = [{ icon: "user", label: "Zylo Vantrell", title: "The character you had open" }];
  renderSees();
  input.value = "Make Zylo Vantrell feel sharper and check his lorebook";
  caption("Scene 1. On send the question goes to the top once (M4). The live line reserves its height and becomes “Worked for…” in place (M3). Phases fold to one line (M5). Scroll up: text fades into the composer, no box (M1/M2).");
  at(900, send);
}
function send() {
  const text = input.value.trim(); if (!text) return;
  input.value = "";
  const sent = sees.filter((s) => !s.later);
  const turn = document.createElement("section"); turn.className = "turn";
  turn.innerHTML = `<div class="user"><div class="bubble">${text.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)}</div>${sent.length ? `<div class="facets">${sent.map((s) => `<span>${ico(s.icon, 11)} ${s.label}</span>`).join("")}</div>` : ""}</div>`;
  stack.querySelector(".arrive")?.remove(); stack.querySelector(".arrive-next")?.remove();
  stack.append(turn);
  placeQuestionAtTop(turn);
  run(turn);
}
function run(turn) {
  const runEl = document.createElement("div"); runEl.className = "run"; turn.append(runEl);
  const live = liveLine(); runEl.append(live); // the live line exists from frame 0 and is always last
  const head = live.querySelector(".headline"), timer = live.querySelector(".timer"), spr = live.querySelector(".sprite > span");
  main.dataset.working = "true";
  const before = (el) => runEl.insertBefore(el, live);
  let secs = 0; const tick = setInterval(() => { secs += 1; timer.textContent = `${secs}s`; }, 1000 / speed); timers.push(tick);
  const say = (t, subj, story) => { head.innerHTML = subj ? `${t} <span class="subj">${subj}</span>` : t; if (story) spr.style.setProperty("--sheet", sheet(story)); };

  at(700, () => { const g = document.createElement("div"); g.className = "goal"; g.innerHTML = `<span class="kicker">Goal</span><b>Sharpen Zylo’s greeting and personality, then check Neon Harbor’s keys</b>`; before(g); });
  let look; at(1300, () => { look = phase("Looking", "file"); before(look); say("Reading", "Zylo Vantrell", "research"); });
  at(2300, () => { addStep(look, "Read", "Zylo Vantrell", 1); say("Reading", "Neon Harbor"); });
  at(3300, () => { addStep(look, "Read", "Neon Harbor · 14 entries", 1); say("Searching the docs for", "greetings", "research"); });
  at(4300, () => { addStep(look, "Searched docs for", "greeting best practice", 1); say("Testing which entries fire", null); });
  at(5400, () => { addStep(look, "Tested", "entry triggers on the last 20 messages", 1); });
  let change; at(5900, () => { foldPhase(look, "Looked at 4 things"); change = phase("Changing", "pencil"); before(change); say("Editing", "Zylo Vantrell", "editing"); });
  at(7000, () => { addStep(change, "Updated", "greeting", 1); });
  at(7600, () => { addStep(change, "Updated", "personality", 1); });
  at(8200, () => { addStep(change, "Updated", "tags", 1); say("Writing the answer", null, "thinking"); });
  at(8700, () => {
    foldPhase(change, "Changed 3 fields of Zylo Vantrell");
    say("Writing the answer", null, "thinking");
    const lead = document.createElement("p"); lead.className = "lead"; before(lead);
    const end = streamHtml(lead, "<span>Zylo now <b>opens in the scene</b>. In Neon Harbor <b>3 keys never fire</b>: I can shorten them.</span>", 0, 40);
    at(end + 150, () => { const r = document.createElement("div"); r.className = "refs"; r.innerHTML = [["ZV", 262, "Zylo Vantrell", "Character"], ["NH", 190, "Neon Harbor", "Lorebook · 14 entries"]].map(ref).join(""); before(r); });
    at(end + 600, () => {
      const g = document.createElement("div"); g.className = "group";
      g.innerHTML = `
        <div class="grow" data-open="false" style="--i:0"><div class="ghead"><button class="gtoggle" type="button" aria-expanded="false"><span class="av" style="--h:262">ZV</span><span class="t"><b>Updated Zylo Vantrell</b><span>Greeting, personality, tags · 3 changes</span></span><span class="gend">${ico("chev", 12).replace("<svg", '<svg class="chev"')}</span></button><button class="link" type="button">Undo</button></div>
          <div class="gbody"><div><div class="gin">
            <div class="field"><span class="flabel">Greeting</span><p class="ftext"><del>Zylo Vantrell is a smuggler from the harbor who is both shy and loud.</del> <ins>*The crate lid slams shut.* “You didn’t see that. Help me carry it and we never met.”</ins></p></div>
            <div class="field"><span class="flabel">Personality</span><p class="ftext">Quick, wry, <del>shy, loud,</del> <ins>guarded until paid</ins></p></div>
            <div class="field"><span class="flabel">Tags</span><div class="tags"><span class="tag tag--del">misc</span><span class="tag tag--ins">noir</span><span class="tag tag--ins">sci-fi</span><span class="tag">smuggler</span></div></div>
            <div class="gacts"><button class="link" type="button">Open Zylo</button><button class="btn" type="button">Keep</button></div>
          </div></div></div></div>
        <div class="grow decision" style="--i:1"><div class="ghead"><span class="av" style="--h:190">NH</span><span class="t"><b>Shorten 3 keys in Neon Harbor? <span class="badge">Needs you</span></b><span>Nobody types them, so the entries never fire</span></span></div>
          <div class="gin"><div class="keymap"><del>harbor gate east</del><span class="arrow">→</span><ins>harbor gate</ins><del>pier 9 ledger</del><span class="arrow">→</span><ins>ledger</ins><del>night tide</del><span class="arrow">→</span><ins>tide</ins></div>
          <div class="gacts"><button class="link" type="button">Not now</button><button class="btn" type="button">Shorten keys</button></div></div></div>`;
      before(g);
      g.querySelector(".gtoggle").onclick = (e) => { const row = e.currentTarget.closest(".grow"); const open = row.dataset.open !== "true"; row.dataset.open = String(open); e.currentTarget.setAttribute("aria-expanded", String(open)); };
      const why = document.createElement("details"); why.className = "why";
      why.innerHTML = `<summary>Why${ico("chev", 11).replace("<svg", '<svg class="chev"')}</summary><ul><li>The old greeting repeated the description.</li><li>A greeting works when the user has something to answer.</li><li>“Shy” and “loud” pulled the replies in two directions.</li></ul>`;
      before(why);
      say("Done", null, "success");
    });
    at(end + 1100, () => {
      clearInterval(tick);
      main.dataset.working = "ending";
      // Same element, now the worked-for line. Nothing unmounts; the reload only swaps data under it.
      live.innerHTML = `<span class="sprite" aria-hidden="true"><span style="--sheet:${sheet("success")}"></span></span><button class="worked" type="button" aria-expanded="false"><svg class="done-mark" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8"/><path d="M5.5 9.2l2.3 2.2 4.6-4.8"/></svg>Worked for ${secs}s · 8 steps</button>`;
      // What next: cards under the run, not chips over the composer.
      const n = document.createElement("div"); n.className = "next"; n.innerHTML = NEXT.map(card).join("");
      runEl.append(n); wireCards(n);
      at(3500, () => { main.dataset.working = ""; live.querySelector(".sprite > span").style.setProperty("--sheet", sheet("idle")); });
    });
  });
}
function wireCards(scope) {
  scope.querySelectorAll(".scard").forEach((c) => (c.onclick = () => {
    if (c.dataset.kind === "do") { c.querySelector(".f").textContent = "Done · opened"; return; }
    input.value = c.querySelector("b").textContent; input.focus();
  }));
}

/* ── Arrival scenes (M9). Everything here is computed from the omnibar context on the client. ── */
// Every fact here is client data the omnibar already has (OmnibarContext, chat store, lastAppError, agent
// configs). Nothing is sent to a model until a ✦ card is clicked or the user types (R22).
const ARRIVALS = {
  chat: {
    line: `You’re in <b>Neon Harbor</b> with Zylo.`,
    meta: "Roleplay · 214 messages · last reply 3 min ago",
    refs: [["ZV", 262, "Zylo Vantrell", "Character"], ["NH", 190, "Neon Harbor", "Lorebook · 3 entries active"]],
    sees: [{ icon: "chat", label: "Chat · Neon Harbor", title: "Name only now; the last 20 messages go when you send", later: true }],
    cards: [
      ["pencil", "Fix the last reply", "It stopped mid-sentence", "mari", "fix"],
      ["search", "Why didn’t “harbor gate” fire?", "0 matches in the last 20 messages"],
      ["file", "Summarize since last summary", "38 new messages"],
      ["eye", "Peek at the prompt", "≈9.4k tokens · opens now", "do"],
    ],
    cap: "Scene 2. Mari arrives knowing the chat: one line, the things in it, and cards with real facts (cut-off reply from finish_reason, 0 key matches from the scan, 38 messages since the summary). Spark cards ask Mari; arrow cards act at once. No model call before a click (R22).",
  },
  agent: {
    line: `This is <b>Illustrator</b>, your image agent.`,
    meta: "On for Neon Harbor · last run failed 2 min ago",
    refs: [["IL", 40, "Illustrator", "Agent · after each reply"]],
    sees: [{ icon: "bot", label: "Agent · Illustrator", title: "The agent you had open" }, { icon: "spark", label: "Last error", title: "Sent only when you send", later: true }],
    cards: [
      ["link", "Pick an image connection", "None selected · 2 available", "do", "fix"],
      ["search", "Why did the last run fail?", "“No image connection selected”"],
      ["pencil", "Tighten its prompt", "1,240 tokens · shown as a review"],
      ["file", "What do its settings do?", "6 settings, 2 changed from default"],
    ],
    cap: "Scene 3. From the agent editor: the failed run (lastAppError, slice 24) becomes a fix card that acts at once, with no Mari run needed. The spark cards ask her with the agent as a facet.",
  },
};
function sceneArrive(kind) {
  reset();
  const a = ARRIVALS[kind];
  sees = a.sees.map((s) => ({ ...s })); renderSees();
  const el = document.createElement("div"); el.className = "arrive";
  el.innerHTML = `<span class="sprite" aria-hidden="true"><span style="--sheet:${sheet("idle")}"></span></span><div class="copy"><p class="line">${a.line}</p><p class="meta">${a.meta}</p><div class="refs" style="margin-top:0.3rem">${a.refs.map(ref).join("")}</div></div>`;
  const n = document.createElement("div"); n.className = "next arrive-next"; n.innerHTML = a.cards.map(card).join("");
  stack.style.minHeight = "100%"; stack.style.justifyContent = "flex-end";
  stack.append(el, n);
  wireCards(n);
  n.querySelectorAll('.scard[data-kind="mari"]').forEach((c) => (c.onclick = () => { input.value = c.querySelector("b").textContent; n.remove(); send(); }));
  caption(a.cap);
}

/* ── Side panels (M6/M7) ── */
function openSide(kind) {
  document.querySelectorAll(".dest button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.side === kind)));
  side.hidden = false; side.dataset.kind = kind;
  const head = (t, s) => `<div class="side-head"><button class="icon-btn back" type="button" aria-label="Back to Mari" data-close>${ico("back", 18)}</button><div class="t"><b>${t}</b><span>${s}</span></div><button class="icon-btn close" type="button" aria-label="Close panel" data-close>${ico("x", 16)}</button></div>`;
  if (kind === "sees") {
    const next = sees.length ? sees.map((s, i) => `<div class="srow"><span class="ic">${ico(s.icon, 14)}</span><span class="t"><b>${s.label}</b><span>${s.later ? "Name only now · content goes when you send" : "Goes with your next message"}</span></span><button class="link" type="button" data-rm="${i}">Remove</button></div>`).join("") : `<div class="srow"><span class="t"><span>Nothing. She only sees what you type.</span></span></div>`;
    side.innerHTML = head("What Mari sees", "Remove anything you do not want her to read.") + `<div class="side-body">
      <div class="sgroup"><span class="kicker">With your next message</span><div class="rows">${next}</div></div>
      <div class="sgroup"><span class="kicker">Always in this Mari chat</span><div class="rows">
        <div class="srow"><span class="ic">${ico("chat", 14)}</span><span class="t"><b>Harbor heist</b><span>Attached chat history · 40 messages · ≈6k tokens</span></span><button class="link" type="button">Remove</button></div>
        <button class="addrow" type="button">${ico("plus", 13)} Attach a chat history</button></div></div>
      <div class="sgroup"><span class="kicker">How she works</span><div class="rows">
        <div class="srow"><span class="ic">${ico("link", 14)}</span><span class="t"><b>GPT model</b><span>Context 12k / 128k</span></span><button class="link" type="button">Change</button></div>
        <div class="srow"><span class="ic">${ico("lock", 14)}</span><span class="t"><b>Sandbox ready</b><span>Changes are reviews you can undo</span></span></div></div></div>
      <p class="note">Your chats, prompts and keys stay on this device until you press Send. Quick answers in the search only see what you type and the name of this screen.</p></div>`;
    side.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => { sees.splice(Number(b.dataset.rm), 1); renderSees(); openSide("sees"); }));
  } else if (kind === "chats") {
    const rows = [["Make Zylo Vantrell feel sharper", "Now · 2 messages", true], ["Why does Illustrator fail", "Yesterday · 6 messages"], ["Theme: warmer light mode", "Sep 28 · 11 messages"], ["Import from SillyTavern", "Sep 21 · 4 messages"]];
    side.innerHTML = head("Mari chats", "New chat keeps this one here.") + `<div class="side-body"><label class="search">${ico("search", 14)}<input placeholder="Search Mari chats" aria-label="Search Mari chats"></label>
      <div class="rows">${rows.map(([t, s, cur]) => `<div class="srow" ${cur ? 'aria-current="true"' : ""}><span class="t"><b>${t}</b><span>${s}</span></span><button class="icon-btn more" type="button" aria-label="Chat actions">${ico("more", 16)}</button></div>`).join("")}</div>
      <p class="note">Rename and Delete live in the row menu (…). Select several with a long press or Shift-click.</p></div>`;
  } else {
    const t = kind === "skills" ? ["Skills", "What Mari can do beyond the basics."] : ["Memories", "What Mari remembers about you."];
    side.innerHTML = head(t[0], t[1]) + `<div class="side-body"><div class="rows"><div class="srow"><span class="t"><span>None yet.</span></span></div><button class="addrow" type="button">${ico("plus", 13)} New</button></div></div>`;
  }
  side.querySelectorAll("[data-close]").forEach((b) => (b.onclick = closeSide));
}
function closeSide() { side.hidden = true; document.querySelectorAll(".dest button").forEach((b) => b.setAttribute("aria-pressed", "false")); }
document.querySelectorAll(".dest button").forEach((b) => (b.onclick = () => (side.hidden || side.dataset.kind !== b.dataset.side ? openSide(b.dataset.side) : closeSide())));

/* ── Demo plumbing ── */
function caption(t) { $("#caption").textContent = t; }
function reset() { clearTimers(); stack.innerHTML = ""; stack.style.minHeight = ""; main.dataset.working = ""; sees = []; renderSees(); closeSide(); tx.scrollTop = 0; syncDock(); }
function scene(name) {
  document.querySelectorAll("[data-scene]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.scene === name)));
  if (name === "run") sceneRun();
  else if (name === "chat" || name === "agent") sceneArrive(name);
  else if (name === "sees") { sceneArrive("chat"); openSide("sees"); caption("Scene 4. “Context” renamed to “What Mari sees”. Three groups: next message (the composer chips), always (attached histories), how she works (model + sandbox, moved from the trust strip)."); }
  else if (name === "chats") { sceneRun(); at(200, () => openSide("chats")); caption("Scene 5. Side panels share one surface: canvas colour, one hairline, Mari’s row language, no card-in-card, no pink buttons. On a phone they are an opaque sheet with Back."); }
}
document.querySelectorAll("[data-scene]").forEach((b) => (b.onclick = () => scene(b.dataset.scene)));
$("#send").onclick = send;
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("#t-theme").onclick = (e) => { const light = root.dataset.theme !== "light"; root.dataset.theme = light ? "light" : "dark"; e.target.textContent = light ? "Dark" : "Light"; };
$("#t-phone").onclick = (e) => { document.body.classList.toggle("phone"); e.target.textContent = document.body.classList.contains("phone") ? "Desktop" : "Phone 390"; syncDock(); };
$("#t-glow").onclick = (e) => { const off = root.dataset.reduce !== "true"; root.dataset.reduce = String(off); e.target.textContent = off ? "Glow on" : "Glow off"; };
$("#t-speed").onclick = (e) => { speed = speed === 1 ? 2 : 1; e.target.textContent = speed === 1 ? "2×" : "1×"; };
const params = new URLSearchParams(location.search);
if (params.get("theme") === "light") $("#t-theme").click();
if (params.get("phone") === "1") $("#t-phone").click();
if (params.get("glow") === "0") $("#t-glow").click();
scene(params.get("scene") || "run");
</script>
